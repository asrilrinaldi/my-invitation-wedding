    <path d="M 200 88 C 150 88, 145 140, 145 190 C 145 250, 125 300, 115 320 L 285 320 C 275 300, 255 250, 255 190 C 255 140, 250 88, 200 88 Z" fill="#D4AF37" opacity="0.25"/>
    <path d="M 200 95 C 160 95, 155 145, 155 195 C 155 255, 135 305, 125 320 L 275 320 C 265 305, 245 255, 245 195 C 245 145, 240 95, 200 95 Z" fill="#846030" opacity="0.6"/>
    <!-- Face Inner Oval -->
