      <stop offset="50%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#9B7A4F"/>
    </linearGradient>
    <radialGradient id="bgGradB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#FBF4EE"/>
    </radialGradient>
  </defs>
  <circle cx="200" cy="200" r="190" fill="url(#bgGradB)"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#goldGradB)" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="200" cy="200" r="176" fill="none" stroke="url(#goldGradB)" stroke-width="1"/>
  
  <!-- Silhouette Bride with Hijab / Elegant Veil -->
  <g fill="#A67C52" opacity="0.85">
