    <!-- Veil Crown / Tiara -->
    <path d="M 180 120 L 190 110 L 200 118 L 210 110 L 220 120 Z" fill="#E2D4B7" stroke="#9B7A4F" stroke-width="1"/>
    <!-- Elegant Wedding Dress Neckline -->
    <path d="M 150 320 C 160 250, 180 230, 200 230 C 220 230, 240 250, 250 320 Z" fill="#FFFFFF" opacity="0.9"/>
    <!-- Necklace -->
    <path d="M 185 210 Q 200 225 215 210" fill="none" stroke="#C5A880" stroke-width="2"/>
    <circle cx="200" cy="222" r="3" fill="#C5A880"/>
  </g>
  <text x="200" y="355" font-family="'Playfair Display', serif" font-size="16" font-weight="600" fill="#846030" text-anchor="middle" letter-spacing="3">THE BRIDE</text>
</svg>
