<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2D4B7"/>
      <stop offset="50%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#9B7A4F"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </radialGradient>
  </defs>
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="200" cy="200" r="176" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
  
  <!-- Silhouette Groom in Suit -->
  <g fill="#2C3E50" opacity="0.85">
    <!-- Head -->
    <ellipse cx="200" cy="140" rx="36" ry="44"/>
    <!-- Hair -->
    <path d="M 164 135 C 164 95, 236 95, 236 135 C 230 115, 175 110, 164 135 Z" fill="#1A252F"/>
    <!-- Neck -->
    <rect x="188" y="178" width="24" height="22" rx="4"/>
    <!-- Shoulders & Suit -->
    <path d="M 120 270 C 120 215, 165 195, 200 195 C 235 195, 280 215, 280 270 L 280 320 L 120 320 Z"/>
    <!-- White Shirt V-shape -->
    <polygon points="190,195 210,195 200,240" fill="#FFFFFF"/>
    <!-- Bowtie -->
    <polygon points="190,205 210,205 200,212" fill="#C5A880"/>
    <polygon points="190,219 210,219 200,212" fill="#C5A880"/>
    <circle cx="200" cy="212" r="3" fill="#9B7A4F"/>
  </g>
  <text x="200" y="355" font-family="'Playfair Display', serif" font-size="16" font-weight="600" fill="#846030" text-anchor="middle" letter-spacing="3">THE GROOM</text>
</svg>
