<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211F24"/>
      <stop offset="50%" stop-color="#36323A"/>
      <stop offset="100%" stop-color="#1A191D"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E6CF"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8232"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="600" height="800" fill="url(#heroBg)"/>
  <circle cx="300" cy="380" r="280" fill="url(#glow)"/>
  
  <!-- Outer Arch Border -->
  <path d="M 60 750 L 60 300 C 60 160, 160 60, 300 60 C 440 60, 540 160, 540 300 L 540 750" fill="none" stroke="url(#goldH)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 75 750 L 75 310 C 75 180, 170 80, 300 80 C 430 80, 525 180, 525 310 L 525 750" fill="none" stroke="url(#goldH)" stroke-width="0.8"/>

  <!-- Floral Decorative Wreath at Top -->
  <g transform="translate(300, 130)" stroke="url(#goldH)" fill="none" stroke-width="1">
    <circle cx="0" cy="0" r="35" stroke-dasharray="2,3"/>
    <path d="M -15 -5 C -30 -20, -50 -10, -45 10 C -40 25, -20 15, -15 -5 Z" fill="#D4AF37" fill-opacity="0.2"/>
    <path d="M 15 -5 C 30 -20, 50 -10, 45 10 C 40 25, 20 15, 15 -5 Z" fill="#D4AF37" fill-opacity="0.2"/>
  </g>

  <!-- Couple Silhouette Under Arch -->
  <g fill="#D4AF37" fill-opacity="0.85">
    <!-- Groom Silhouette -->
    <circle cx="260" cy="350" r="30"/>
    <path d="M 210 500 C 210 420, 235 390, 260 390 C 285 390, 300 420, 300 500 Z"/>

    <!-- Bride Silhouette Holding Hands / Bouquet -->
    <circle cx="335" cy="365" r="26"/>
    <path d="M 300 500 C 300 430, 315 405, 335 405 C 355 405, 385 435, 385 500 Z"/>
    
    <!-- Joined Arms / Bouquet -->
    <circle cx="298" cy="455" r="14" fill="#F2E6CF"/>
  </g>

  <!-- Names Monogram -->
  <text x="300" y="580" font-family="'Playfair Display', serif" font-size="44" font-weight="300" fill="url(#goldH)" text-anchor="middle" letter-spacing="8">ASRIL &amp; SISI</text>
  <text x="300" y="620" font-family="sans-serif" font-size="14" font-weight="400" fill="#E2D4B7" text-anchor="middle" letter-spacing="6">20 . 06 . 2027</text>
  <line x1="220" y1="640" x2="380" y2="640" stroke="url(#goldH)" stroke-width="1" stroke-opacity="0.6"/>
</svg>
